<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craigslist || Store</title>
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body>
    <header>
      <div class="main">
        <div class="logo">
          <img src="../Arts/images/CG-Icon.png" alt="" />
          <h3>Craigslist</h3>
        </div>

        <div class="right-row">
          <div class="create-post">
            <button>+ Create Post</button>
          </div>

          <div class="account">
            <button>Sign Up</button>
            <button>Log In</button>
          </div>
        </div>
      </div>

      <nav class="category">
        <select name="community" id="cummunity">
          <div class="column">
            <option>Activities</option>
            <option>Artist</option>
            <option>Childcare</option>
          </div>

          <div class="column">
            <option>classes</option>
            <option>Events</option>
            <option>General</option>
          </div>

          <div class="column">
            <option>Groups</option>
            <option>Local News</option>
            <option>Lost and Found</option>
          </div>

          <div class="column">
            <option>Missed</option>
            <option>Connections</option>
            <option>Musicians</option>
          </div>

          <div class="column">
            <option>Pets</option>
            <option>Politics</option>
            <option>Rants & Raves</option>
          </div>

          <div class="column">
            <option>Rideshare</option>
            <option>Volunteers</option>
          </div>
        </select>
      </nav>
    </header>
  </body>
</html>
